name: Day 17 SWA Deploy

on:
  push:
    branches: ["day17-swa-deploy"]
    paths:
      - "day-17/Piece1/quotes-feed/**"
      - ".github/workflows/day17-swa-deploy.yml"
  pull_request:
    branches: ["day17-swa-deploy"]
    paths:
      - "day-17/Piece1/quotes-feed/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: day-17/Piece1/quotes-feed
        run: npm ci

      - name: Build
        working-directory: day-17/Piece1/quotes-feed
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DAY17 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "day-17/Piece1/quotes-feed/dist/quotes-feed/browser"
          skip_app_build: true
