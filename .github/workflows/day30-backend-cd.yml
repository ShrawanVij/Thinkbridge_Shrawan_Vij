name: Day 30 Backend CD

# Gate: deploy only runs if test passes (job dependency below).
# Post-deploy check: smoke-test hits the live /health endpoint before
# calling the run successful — a broken deploy shows red here, not
# silently in production.
on:
  push:
    branches: ["main"]
    paths:
      - "day-30/Piece1/src/**"
      - "day-30/Piece1/tests/**"
      - "day-30/Piece1/QuotesApi.slnx"
      - ".github/workflows/day30-backend-cd.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: day-30/Piece1
        run: dotnet restore QuotesApi.slnx

      - name: Test
        working-directory: day-30/Piece1
        run: dotnet test QuotesApi.slnx --configuration Release --no-restore

  deploy:
    name: Deploy (only if test passed)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to Azure
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --client-secret "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Restore the dev azd environment
        working-directory: day-30/Piece1
        run: |
          azd env new dev --no-prompt \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --location "${{ vars.AZURE_LOCATION }}"
          # Not a secret -- a resource ID for the shared Container Apps
          # environment, the same one set locally via `azd env set` during
          # the original provision. Has no azd-builtin flag like
          # --subscription/--location do, so it has to be set explicitly or
          # `azd env refresh` has no way to resolve this Bicep parameter.
          # Comes from a repo Variable, not hardcoded here, so changing
          # environments is a settings change, not a code change.
          azd env set CONTAINER_APPS_ENVIRONMENT_ID "${{ vars.CONTAINER_APPS_ENVIRONMENT_ID }}"
          azd env refresh --no-prompt

      - name: Deploy the API
        working-directory: day-30/Piece1
        run: azd deploy api --no-prompt

  smoke-test:
    name: Verify the live deployment is healthy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

      - name: Look up the live FQDN (never hardcoded -- asks Azure directly)
        id: app
        run: |
          fqdn=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Poll /health until it responds 200
        run: |
          url="https://${{ steps.app.outputs.fqdn }}/health"
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" = "200" ]; then
              echo "Healthy after attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: got HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "Deployment did not become healthy within the timeout."
          exit 1
