name: Day 30 SWA Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "day-30/Piece1/quotes-app/**"
      - ".github/workflows/day30-swa-deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "day-30/Piece1/quotes-app/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: day-30/Piece1/quotes-app
        run: npm ci

      - name: Build
        working-directory: day-30/Piece1/quotes-app
        run: npm run build -- --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DAY30 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "day-30/Piece1/quotes-app/dist/quotes-app/browser"
          skip_app_build: true
