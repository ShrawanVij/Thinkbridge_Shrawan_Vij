# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: quotes-stack
metadata:
  template: quotes-stack@0.0.1

infra:
  provider: bicep
  path: infra
  module: main
  deploymentStacks:
    denySettings:
      mode: denyDelete
    bypassStackOutOfSyncError: false
    actionOnUnmanage:
      resources: delete
      resourceGroups: delete
